<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5c400">
  <title>Your account · LagosGo</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .account-shell{max-width:620px;margin:0 auto;padding:24px 18px 48px}
    .account-card{background:#fff;border:1px solid #e8e5da;border-radius:22px;padding:24px;margin-top:28px}
    .account-card h1{margin:6px 0 10px;font-size:30px}
    .account-row{padding:14px 0;border-bottom:1px solid #eeeae0;overflow-wrap:anywhere}
    .account-row:last-child{border-bottom:0}
    .account-label{display:block;color:#777;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
    .account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .account-actions a,.account-actions button{padding:13px 16px;border-radius:12px;border:1px solid #171717;background:#171717;color:#fff;text-decoration:none;font-weight:800}
    .account-actions .secondary{background:#fff;color:#171717}
    #accountStatus{color:#68665e}
  </style>
</head>
<body>
  <main class="account-shell">
    <a href="/" class="brand" style="text-decoration:none;color:inherit"><span class="brand-mark">L</span><span>Lagos<span class="brand-light">Go</span><small>MOVE YOUR WAY</small></span></a>
    <section class="account-card">
      <p class="eyebrow">LAGOSGO ACCOUNT</p>
      <h1>Your account</h1>
      <p id="accountStatus" role="status" aria-live="polite">Checking your session securely…</p>
      <div id="accountDetails" hidden>
        <div class="account-row"><span class="account-label">Email</span><strong id="accountEmail"></strong></div>
        <div class="account-row"><span class="account-label">Account role</span><strong id="accountRole">passenger</strong></div>
        <div class="account-row"><span class="account-label">User ID</span><span id="accountId"></span></div>
        <p>Driver and administrator permissions require separate approval. Signing up never grants privileged access.</p>
        <div class="account-actions"><button id="signOutBtn" type="button">Sign out</button><a class="secondary" href="/">Back to home</a></div>
      </div>
    </section>
  </main>
  <script type="module" src="/account.js"></script>
</body>
</html>
